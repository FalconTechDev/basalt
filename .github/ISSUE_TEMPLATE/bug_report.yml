name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a board
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Basalt version
      description: Settings → About
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Notes, Boards, Graph, Export, CLI, API, Plugins, Sync or sharing, Installer, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or error text
      render: text
