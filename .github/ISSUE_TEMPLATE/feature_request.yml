name: Feature request
description: An idea that would make Basalt better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: Alternatives you considered
