[package]
name = "graph-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fp-core = { path = "../../falconplot/crates/fp-core" }
fp-graph = { path = "../../falconplot/crates/fp-graph" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
